<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>Timer de Foco por Guia</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <h2>⏱️ Timer de Produtividade</h2>

    <label for="work-time">Tempo de Trabalho (min):</label>
    <input type="number" id="work-time" min="1" value="25" />

    <label for="rest-time">Tempo de Descanso (min):</label>
    <input type="number" id="rest-time" min="1" value="5" />

    <label for="cycles">Ciclos:</label>
    <input type="number" id="cycles" min="1" value="4" />

    <button id="start">🎯 Iniciar Produtividade</button>

    <hr />

    <h3>Relatório de Produtividade</h3>
    <p>Tempo de trabalho total: <span id="work-time-report">0</span> minutos</p>
    <p>Tempo de descanso total: <span id="rest-time-report">0</span> minutos</p>
    <p>Ciclos completados: <span id="cycles-report">0</span></p>
  </div>

  <script src="popup.js"></script>
</body>
</html>
